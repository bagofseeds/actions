name: Run lint command

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      requirements-file:
        description: Path to requirements file to install before lint command
        required: false
        default: ""
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
      lint-command:
        description: Command to execute for linting
        required: false
        default: "ruff check ."
      working-directory:
        description: Directory where lint command should run
        required: false
        default: "."
        
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      requirements-file:
        description: Path to requirements file to install before lint command
        required: false
        default: ""
        type: string
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
        type: string
      lint-command:
        description: Command to execute for linting
        required: false
        default: "ruff check ."
        type: string
      working-directory:
        description: Directory where lint command should run
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          
      - name: Install base dependencies
        shell: bash
        run: python -m pip install --upgrade pip
        
      - name: Install from requirements file
        if: ${{ inputs.requirements-file != '' }}
        shell: bash
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [[ -f "$REQUIREMENTS_FILE" ]]; then
            pip install -r "$REQUIREMENTS_FILE"
          else
            echo "::warning::Requirements file '$REQUIREMENTS_FILE' was not found; skipping."
          fi
          
      - name: Install extra dependencies
        if: ${{ inputs.pip-install != '' }}
        shell: bash
        env:
          PIP_DEPS: ${{ inputs.pip-install }}
        run: |
          unset args_array
          eval "args_array=($(echo "$PIP_DEPS" | xargs))"
          pip install "${args_array[@]}"
          
      - name: Run lint
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}
