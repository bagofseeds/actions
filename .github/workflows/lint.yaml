name: Run lint command

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      requirements-file:
        description: Path to requirements file to install before lint command
        required: false
        default: ""
      pip-dependencies:
        description: Comma-separated pip dependencies to install (workflow_dispatch only)
        required: false
        default: ""
      lint-command:
        description: Command to execute for linting
        required: false
        default: "ruff check ."
      working-directory:
        description: Directory where lint command should run
        required: false
        default: "."
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      requirements-file:
        description: Path to requirements file to install before lint command
        required: false
        default: ""
        type: string
      lint-command:
        description: Command to execute for linting
        required: false
        default: "ruff check ."
        type: string
      working-directory:
        description: Directory where lint command should run
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install base dependencies
        shell: bash
        run: python -m pip install --upgrade pip
      - name: Install from requirements file
        if: ${{ inputs.requirements-file != '' }}
        shell: bash
        run: pip install -r "${{ inputs.requirements-file }}"
      - name: Install dispatch extra dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pip-dependencies != '' }}
        shell: bash
        env:
          PIP_DEPS: ${{ inputs.pip-dependencies }}
        run: |
          IFS=',' read -r -a dependencies <<< "$PIP_DEPS"
          for dep in "${dependencies[@]}"; do
            dep="$(echo "$dep" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -n "$dep" ]]; then
              pip install "$dep"
            fi
          done
      - name: Run lint
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}
