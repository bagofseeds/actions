name: Run pytest coverage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      requirements-file:
        description: Path to requirements file to install before running coverage
        required: false
        default: ""
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
      coverage-target:
        description: Coverage target passed to --cov
        required: false
        default: "."
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
        
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      requirements-file:
        description: Path to requirements file to install before running coverage
        required: false
        default: ""
        type: string
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
        type: string
      coverage-target:
        description: Coverage target passed to --cov
        required: false
        default: "."
        type: string
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
        type: string
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          
      - name: Install base dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          
      - name: Install from requirements file
        if: ${{ inputs.requirements-file != '' }}
        shell: bash
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [[ -f "$REQUIREMENTS_FILE" ]]; then
            pip install -r "$REQUIREMENTS_FILE"
          else
            echo "::warning::Requirements file '$REQUIREMENTS_FILE' was not found; skipping."
          fi
          
      - name: Install extra dependencies
        if: ${{ inputs.pip-install != '' }}
        shell: bash
        env:
          PIP_DEPS: ${{ inputs.pip-install }}
        run: |
          if [ -z "$PIP_DEPS" ]; then
            echo "No dependencies provided."
            exit 0
          fi

          unset args_array
          eval "args_array=($(echo "$PIP_DEPS" | xargs))"
          pip install "${args_array[@]}"
          
      - name: Run pytest with coverage
        shell: bash
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          unset args_array
          eval "args_array=($(echo "$PYTEST_ARGS" | xargs))"
          pytest                                 \
            --cov=${{ inputs.coverage-target }}  \
            --cov-report=term                    \
            --cov-report=xml                     \
            "${args_array[@]}"
        
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: ${{ inputs.working-directory }}/coverage.xml
