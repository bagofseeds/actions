name: Run pytest coverage

description: Reusable workflow to run pytest with coverage and upload coverage.xml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      pip-dependencies:
        description: Newline-separated pip dependencies to install before running coverage
        required: false
        default: ""
      coverage-target:
        description: Coverage target passed to --cov
        required: false
        default: "."
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      pip-dependencies:
        description: Newline-separated pip dependencies to install before running coverage
        required: false
        default: ""
        type: string
      coverage-target:
        description: Coverage target passed to --cov
        required: false
        default: "."
        type: string
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
        type: string
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          while IFS= read -r dependency; do
            if [[ -n "$dependency" ]]; then
              pip install "$dependency"
            fi
          done << 'EOF'
          ${{ inputs.pip-dependencies }}
          EOF
      - name: Run pytest with coverage
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pytest --cov=${{ inputs.coverage-target }} --cov-report=term --cov-report=xml ${{ inputs.pytest-args }}
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: ${{ inputs.working-directory }}/coverage.xml
