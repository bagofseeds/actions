name: Run pytest matrix

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      requirements-file:
        description: Path to requirements file to install before pytest (e.g., requirements-test.txt)
        required: false
        default: ""
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
        
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      requirements-file:
        description: Path to requirements file to install before pytest (e.g., requirements-test.txt)
        required: false
        default: ""
        type: string
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
        type: string
      pytest-args:
        description: Extra arguments passed to pytest
        required: false
        default: ""
        type: string
      working-directory:
        description: Directory where pytest should run
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        # The floor, a middle version, and the newest. Testing only the
        # two ends misses anything that behaves differently in between:
        # on 3.9 and 3.10 `isinstance(list[str], type)` is True, which is
        # false on either side of them, and a bug riding on that reached
        # `main` in bagof-magic without CI ever going red.
        python-version: ["3.8", "3.10", "3.x"]
    uses: ./.github/workflows/test.yaml
    with:
      tag: ${{ inputs.tag }}
      python-version: ${{ matrix.python-version }}
      requirements-file: ${{ inputs.requirements-file }}
      pip-install: ${{ inputs.pip-install }}
      pytest-args: ${{ inputs.pytest-args }}
      working-directory: ${{ inputs.working-directory }}
