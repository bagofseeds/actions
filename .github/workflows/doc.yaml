name: Build and deploy docs with zensical

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      docs-requirements-file:
        description: Path to docs requirements file
        required: false
        default: "docs/requirements.txt"
      build-command:
        description: Command that builds docs into the Pages artifact directory
        required: false
        default: "zensical build --clean"
      site-path:
        description: Path of generated static site to publish
        required: false
        default: "site"
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      docs-requirements-file:
        description: Path to docs requirements file
        required: false
        default: "docs/requirements.txt"
        type: string
      build-command:
        description: Command that builds docs into the Pages artifact directory
        required: false
        default: "zensical build --clean"
        type: string
      site-path:
        description: Path of generated static site to publish
        required: false
        default: "site"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install docs dependencies
        if: ${{ inputs.docs-requirements-file != '' }}
        shell: bash
        env:
          REQUIREMENTS_FILE: ${{ inputs.docs-requirements-file }}
        run: |
          if [[ -f "$REQUIREMENTS_FILE" ]]; then
            pip install -r "$REQUIREMENTS_FILE"
          else
            echo "::warning::Requirements file '$REQUIREMENTS_FILE' was not found; skipping."
          fi
      - name: Build docs
        shell: bash
        run: ${{ inputs.build-command }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.site-path }}
      - uses: actions/deploy-pages@v4
        id: deployment
