name: Build and deploy docs with zensical

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: false
        default: "3.x"
      requirements-file:
        description: Path to docs requirements file
        required: false
        default: "docs/requirements.txt"
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
      build-command:
        description: Command that builds docs into the Pages artifact directory
        required: false
        default: "zensical build --clean"
      site-path:
        description: Path of generated static site to publish
        required: false
        default: "site"
        
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.x"
        type: string
      requirements-file:
        description: Path to docs requirements file
        required: false
        default: "docs/requirements.txt"
        type: string
      pip-install:
        description: Pip dependencies to install
        required: false
        default: ""
        type: string
      build-command:
        description: Command that builds docs into the Pages artifact directory
        required: false
        default: "zensical build --clean"
        type: string
      site-path:
        description: Path of generated static site to publish
        required: false
        default: "site"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    env:
      REQUIREMENTS_FILE: ${{ inputs.requirements-file || 'docs/requirements.txt' }}
      
    steps:
      - uses: actions/configure-pages@v5
      
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          
      - name: Install docs dependencies
        if: ${{ env.REQUIREMENTS_FILE != '' }}
        shell: bash
        env:
          REQUIREMENTS_FILE: ${{ env.REQUIREMENTS_FILE }}
        run: |
          if [[ -f "$REQUIREMENTS_FILE" ]]; then
            pip install -r "$REQUIREMENTS_FILE"
          else
            echo "::warning::Requirements file '$REQUIREMENTS_FILE' was not found; skipping."
          fi
          
      - name: Install extra dependencies
        if: ${{ inputs.pip-install != '' }}
        shell: bash
        env:
          PIP_DEPS: ${{ inputs.pip-install }}
        run: |
          unset args_array
          eval "args_array=($(echo "$PIP_DEPS" | xargs))"
          pip install "${args_array[@]}"
          
      - name: Convert example notebooks to markdown
        shell: bash
        run: |
          if compgen -G "docs/examples/*.ipynb" > /dev/null 2>&1; then
            curl -fsSL \
              https://raw.githubusercontent.com/bagofseeds/actions/main/scripts/nb2md.py \
              -o /tmp/nb2md.py
            python /tmp/nb2md.py docs/examples/*.ipynb
          else
            echo "No example notebooks to convert; skipping."
          fi

      - name: Build docs
        shell: bash
        run: ${{ inputs.build-command }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.site-path }}
          
      - uses: actions/deploy-pages@v4
        id: deployment
